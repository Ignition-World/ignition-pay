name: ci-dart

on:
  pull_request:
    paths:
      - "packages/core-dart/**"
      - "spec/**"
  push:
    branches: [main]
    paths:
      - "packages/core-dart/**"
      - "spec/**"

jobs:
  # ── Dart analyze (language-static checks) ──────────────────────────
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: cd packages/core-dart && dart pub get
      - run: cd packages/core-dart && dart analyze --fatal-infos

  # ── Unit + spec tests across multiple Dart SDKs ────────────────────
  test:
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dart-version:
          - "3.0"
          - "3.6"
          - stable
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart-version }}
      - run: cd packages/core-dart && dart pub get
      - run: cd packages/core-dart && dart test
      - run: cd packages/core-dart && dart run tool/comprehensive_test.dart
        if: matrix.dart-version == 'stable'

  # ── Web / Chrome compatibility tests ───────────────────────────────
  test-web:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: cd packages/core-dart && dart pub get
      - run: cd packages/core-dart && dart test test/web_compat --platform chrome
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

  # ── Coverage report ────────────────────────────────────────────────
  coverage:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: cd packages/core-dart && dart pub get

      - name: Run tests with coverage
        run: cd packages/core-dart && dart test --coverage=coverage

      - name: Format coverage report
        run: |
          cd packages/core-dart
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: packages/core-dart/coverage/lcov.info
          flags: dart
          fail_ci_if_error: false

  # ── Spec compliance check ──────────────────────────────────────────
  spec-check:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: cd packages/core-dart && dart pub get
      - run: cd packages/core-dart && dart test test/spec_runner_test.dart

  # ── Flutter compatibility matrix ───────────────────────────────────
  flutter-test:
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        if: matrix.flutter-channel == 'stable'
      - run: cd packages/core-dart && flutter pub get
      - run: cd packages/core-dart && flutter test
      - run: cd packages/core-dart && flutter test test/web_compat --platform chrome
        if: matrix.flutter-channel == 'stable'
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
