name: ignition_mobile
description: Ignition Mobile — a Flutter mobile application for the Ignition Pay ecosystem.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  in_app_review: ^2.0.9
  shared_preferences: ^2.3.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^6.0.1
  dio: ^5.7.0
  shimmer: ^4.0.0
  cached_network_image: ^4.0.2
  google_fonts: ^8.2.1
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  app_links: ^7.2.1
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  stellar_address_kit:
    path: ../packages/core-dart
  meta: ^1.18.0
  crypto: ^3.0.7
  sentry_flutter: ^8.0.0
  firebase_crashlytics: ^5.4.0
  logging: ^1.2.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  test: ^1.31.0
  mockito: ^5.6.4
  mocktail: ^1.0.5
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env