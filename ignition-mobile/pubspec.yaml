name: ignition_mobile
description: Ignition Mobile — a Flutter mobile application for the Ignition Pay ecosystem.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  in_app_review: ^2.0.9
  shared_preferences: ^2.3.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^5.1.0
  dio: ^5.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  firebase_analytics: ^11.4.5
  app_links: ^6.0.0 # ← add this (for stack-preserving deep links)
  go_router: ^14.6.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  stellar_address_kit:
    path: ../packages/core-dart
  meta: ^1.18.0
  crypto: ^3.0.7
  sentry_flutter: ^8.0.0
  firebase_crashlytics: ^4.0.0
  logging: ^1.2.0
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2
  connectivity_plus: ^7.3.1

dev_dependencies:
  # On-device end-to-end suite. Single entry point: integration_test/app_test.dart.
  # Run a subset via --dart-define=SCENARIO=<app_launch|deep_link|auth_flow|android|ios|all>.
  # See ignition-mobile/README_INTEGRATION_TESTING.md for caveats.
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  mockito: ^5.4.4
  mocktail: ^1.0.3
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  flutter_lints: ^3.0.1


flutter:
  uses-material-design: true
  assets:
    - .env